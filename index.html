function render(){frame.src=frames[index];frame.alt=captions[index].title;title.textContent=captions[index].title;desc.textContent=captions[index].desc;counter.textContent=`A LITTLE ADVENTURE · ${index+1} / ${frames.length}`;progress.innerHTML='';frames.forEach((_,i)=>{const d=document.createElement('span');d.className='dot'+(i===index?' active':'');progress.appendChild(d)});back.disabled=index===0;back.style.opacity=index===0?'.35':'1';next.textContent=index===frames.length-1?'Back to the letter':'Next';}
function openStory(){if(timer)clearInterval(timer);index=0;render();modal.classList.add('show');document.getElementById('hint').textContent='Watch what happens when he climbs up…';document.getElementById('pause').textContent='Pause';timer=setInterval(()=>{if(index<frames.length-1){index++;render()}else{clearInterval(timer);timer=null;document.getElementById('pause').textContent='Play'}},1900);}
function closeStory(){modal.classList.remove('show');if(timer)clearInterval(timer);timer=null;}
function step(n){index=Math.max(0,Math.min(frames.length-1,index+n));render();if(index===frames.length-1)next.textContent='Replay';}
